
<!DOCTYPE html>
<html>
    <head>
        <title>
            Hyperlink
        </title>
    </head>
    <body>
        <!-- Main heading of the webpage -->
        <h1>Welcome to another lesson</h1>
        <h2>let's code and cry</h2>
  <!-- The horizontal rule adds a line to separate content -->
        <hr>

        <p> Before we start, let me ask you a question</p>
        <br>
        <p><b>Do you like sad songs?</b></p>

        If the answer is yes, I can suggest you a song!

            <!-- href specifies the destination URL -->
            <!-- target="_blank" opens the link in a new tab -->
            <!-- title provides extra information when hovering over the link -->
        <p>
            <a href="https://www.youtube.com/watch?v=gEo8IrFbecM&list=RDMMDKbfBSrjVHA&index=15"      
               target="_blank"
               title="Goes to YouTube">
                Click meee!!!
            </a>
        </p>

        <!-- So this is how you can add a hyperlink, understood? Then bye!!!! -->
    </body>
</html>
