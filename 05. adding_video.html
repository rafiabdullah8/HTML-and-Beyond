<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Video</title>
</head>

<body>
    <h1>Let's Add a Video to This Webpage</h1>
    <hr>

    <p>
        To add a video to your website, first put the video
        file alongside your index file.<br>
        <b><i>Remember, the filename must match the one
        you write in the code.</i></b>
    </p>

    <!-- Adding a video with playback controls -->
    <video width="300" controls autoplay muted loop>
        <source src="0310.mp4" type="video/mp4">
    </video>
</body>
</html>
